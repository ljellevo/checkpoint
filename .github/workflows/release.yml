name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Get next version
        id: version
        run: |
          LATEST=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | jq -r '.tag_name // empty')
          if [ -z "$LATEST" ]; then
            NEXT=1
          else
            CURRENT=$(echo "$LATEST" | sed 's/^v//')
            NEXT=$((CURRENT + 1))
          fi
          echo "version=v$NEXT" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          GOOS=darwin  GOARCH=amd64 go build -o checkpoint-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -o checkpoint-darwin-arm64 .
          GOOS=linux   GOARCH=amd64 go build -o checkpoint-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -o checkpoint-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o checkpoint-windows-amd64.exe .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            checkpoint-darwin-amd64
            checkpoint-darwin-arm64
            checkpoint-linux-amd64
            checkpoint-linux-arm64
            checkpoint-windows-amd64.exe
            install.sh
