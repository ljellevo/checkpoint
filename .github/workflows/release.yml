name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0). Don't include the 'v' prefix, it will be added automatically."
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.actor == 'ljellevo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binaries
        run: |
          GOOS=darwin  GOARCH=amd64 go build -o checkpoint-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -o checkpoint-darwin-arm64 .
          GOOS=linux   GOARCH=amd64 go build -o checkpoint-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -o checkpoint-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o checkpoint-windows-amd64.exe .

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          files: |
            checkpoint-darwin-amd64
            checkpoint-darwin-arm64
            checkpoint-linux-amd64
            checkpoint-linux-arm64
            checkpoint-windows-amd64.exe
            install.sh
